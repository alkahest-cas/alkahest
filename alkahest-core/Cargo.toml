[package]
name = "alkahest-cas"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description   = "High-performance computer algebra kernel: symbolic expressions, polynomials, Gröbner bases, JIT, and Arb ball arithmetic."
repository    = "https://github.com/alkahest-cas/alkahest"
homepage      = "https://alkahest-cas.github.io/alkahest/"
documentation = "https://docs.rs/alkahest-cas"
keywords      = ["computer-algebra", "symbolic-math", "polynomial", "groebner", "jit"]
categories    = ["mathematics", "science"]
readme        = "../README.md"

[package.metadata.docs.rs]
# Build docs with feature-gated APIs visible; jit omitted because
# docs.rs does not have LLVM 15 headers available.
features      = ["egraph", "groebner", "parallel"]
rustdoc-args  = ["--cfg", "docsrs"]

[features]
default = ["groebner"]
egraph = ["dep:egglog"]
# Requires LLVM 15 dev headers (llvm-15-dev / llvm@15) at compile time.
jit   = ["dep:inkwell"]
# Pure-Rust Tier-1 JIT: ~10× faster compile than LLVM, ~10–20% slower code.
# Enables JIT in the default PyPI wheel without a system LLVM install.
cranelift = [
    "dep:cranelift-jit",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-native",
]
parallel = ["dep:rayon", "dep:dashmap"]
# Phase 29: use FLINT >= 3.0's Arb types for ArbBall when available; ArbBall
# itself falls back to MPFR when this is off.
#
# NOTE: this does NOT make FLINT optional. A system FLINT is required by every
# build of this crate — `src/flint/` is compiled unconditionally, `UniPoly`
# stores a `FlintPoly`, and factorization, resultants, normal forms and
# `number_theory` all call FLINT with no pure-Rust fallback. The feature (and
# the separate `flint3` cfg that `build.rs` auto-detects) selects which FLINT
# *version's* API to call, nothing more. See `build.rs`.
flint3 = []
# V5-11: Gröbner basis computation (F4-style over ℚ)
groebner = []
# V1-1: production NVPTX JIT backend. Implies `jit` for the inkwell-based
# codegen. Requires LLVM 15 with the NVPTX target (`llc --version | grep nvptx`)
# at build time and libcuda.so.1 at runtime. cudarc uses dynamic loading so the
# feature builds even on machines without CUDA installed.
cuda = ["jit", "dep:cudarc"]
# V1-7: GPU-accelerated Gröbner basis via Macaulay-matrix row reduction mod p.
# Only needs cudarc (driver + NVRTC), NOT inkwell/jit — the reduction kernel is
# a static PTX string, not LLVM-generated. Falls back to pure-Rust row reduction
# when no CUDA device is present at runtime.
groebner-cuda = ["groebner", "dep:cudarc"]

[dependencies]
rug = { version = "1", features = ["integer", "rational", "float"] }
num-integer = "0.1"
# Accurate transcendental fallbacks for the f64 evaluation path (erf/erfc), so
# eval_expr matches the emitted C (libm) and the interval path.
libm = "0.2"
# force-cross lets gmp-mpfr-sys build when the Rust host and target triples
# differ (e.g. x86_64-pc-windows-msvc host → x86_64-pc-windows-gnu target).
gmp-mpfr-sys = { version = "1", features = ["force-cross"] }
# getrlimit(RLIMIT_AS)/sysconf for the address-space guard in `budget::memory`,
# which refuses before GMP's uncatchable out-of-memory abort. Already in the
# lock file transitively via gmp-mpfr-sys.
libc = "0.2"
egglog  = { version = "0.4", optional = true }
inkwell = { version = "0.9", features = ["llvm15-0-prefer-dynamic"], optional = true }
cranelift-jit      = { version = "0.132", optional = true }
cranelift-codegen  = { version = "0.132", optional = true }
cranelift-frontend = { version = "0.132", optional = true }
cranelift-module   = { version = "0.132", optional = true }
cranelift-native   = { version = "0.132", optional = true }
rayon   = { version = "1",   optional = true }
dashmap = { version = "6",   optional = true }
cudarc  = { version = "0.19", default-features = false, features = ["driver", "nvrtc", "fallback-dynamic-loading", "cuda-12060"], optional = true }
bitflags = "2.11.1"
boxcar = "0.2.14"
wide = "0.7"

[dev-dependencies]
proptest = "1"
codspeed-criterion-compat = { version = "2", features = ["html_reports"] }

[[bench]]
name = "alkahest_bench"
harness = false

[[bench]]
name = "symbolic_gpu_bench"
harness = false

[[example]]
name = "dump_ptx"
required-features = ["cuda"]

# Scaling / regression harnesses for the parallel simplifier.
[[example]]
name = "simplify_scaling"
required-features = ["parallel"]

[[example]]
name = "simplify_probe"
required-features = ["parallel"]

[[example]]
name = "simplify_clean"
required-features = ["parallel"]

[[example]]
name = "pool_read_scaling"
required-features = ["parallel"]

[[example]]
name = "simplify_three_way"
required-features = ["parallel"]

[[example]]
name = "pool_build_scaling"
