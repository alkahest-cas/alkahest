[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "alkahest"
version = "3.13.2"
description = "A high-performance computer algebra system for Python"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Alkahest Contributors" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
rl = ["verifiers>=0.1.5", "datasets>=2.0"]
rl-integration = ["verifiers>=0.1.5", "datasets>=2.0"]

[project.urls]
Homepage = "https://github.com/alkahest-cas/alkahest"
Documentation = "https://alkahest-cas.github.io/docs/"
Repository = "https://github.com/alkahest-cas/alkahest"
Issues = "https://github.com/alkahest-cas/alkahest/issues"

[tool.maturin]
python-source = "python"
manifest-path = "alkahest-py/Cargo.toml"
module-name = "alkahest"
features = ["pyo3/extension-module"]
# `vendor/egglog` is reached only through the workspace's [patch.crates-io], which
# maturin does not follow when packing path dependencies, and without it a build
# from the sdist stops at `cargo metadata`. .github/scripts/check_sdist.py guards
# this list and the absence of everything else.
include = [{ path = "vendor/egglog/**/*", format = "sdist" }]

# ── Dev / CI dependencies ────────────────────────────────────────────────────
# Use `uv sync --no-install-project --group dev` to install.
# (--no-install-project skips building the Rust extension; use `maturin develop` for that.)
[dependency-groups]
dev = [
    "maturin>=1.5,<2.0",
    "pytest>=7",
    "pytest-timeout",
    "hypothesis",
    "ruff>=0.15",
    "ty>=0.0.1",
]
# Extra oracle / comparison deps — pulled in CI nightly extras shard only.
ci-extras = [
    "sympy",
    "mpmath",
    "symengine",
    "wolframclient",
    # Ships both the Python bindings and a `z3` binary, which is what
    # alkahest.smt discovers. Without it the SMT bridge's solver round-trip
    # tests skip, and only the emitter and the refusal paths get exercised.
    "z3-solver",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
# Deliberately still py39 although requires-python is now >=3.10: raising it
# turns on B905 (zip strict=), UP035 and RUF007 across ~235 sites, a style
# rewrite that is a separate change from dropping 3.9. py39 is a subset of
# py310, so this never lets ruff suggest syntax 3.10 cannot run.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "TCH", "C4"]
# RUF001/002/003: math library intentionally uses unicode symbols (ℤ, ℚ, ×, –)
# PT011/B017: pytest.raises without match= is acceptable while test suite matures;
#             tests that care about message content already use exc_info.value checks.
ignore = ["RUF001", "RUF002", "RUF003", "PT011", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── ty (type checker) ────────────────────────────────────────────────────────
# src is passed explicitly on the CLI: `ty check python/alkahest/`
[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
# numpy and jax are optional runtime deps not present in the lean dev venv;
# the compiled Rust extension (.alkahest) is resolved via the alkahest.pyi stub.
# Downgrade to "warn" so CI is not blocked by missing optional third-party packages.
unresolved-import = "warn"
