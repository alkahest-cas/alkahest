[package]
name = "alkahest-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "alkahest"
crate-type = ["cdylib"]

[features]
default = ["egraph", "groebner"]
# Share the system libgmp/libmpfr with FLINT (one GMP in the process); see the
# feature of the same name in alkahest-core/Cargo.toml. Opt-in, because it needs
# GMP >= 6.3 / MPFR >= 4.2; every published PyPI wheel is built with it
# (`maturin build --features "... system-gmp"` in release-build.yml).
system-gmp = ["alkahest-core/system-gmp"]
egraph = ["alkahest-core/egraph"]
jit = ["alkahest-core/jit"]
cranelift = ["alkahest-core/cranelift"]
# There is deliberately no `numpy` feature. It gated the `numpy` crate, which
# this crate never used a single item from, and `capabilities()` reported it as
# a capability that therefore meant nothing: `alkahest.numpy_eval` works on the
# default (feature-off) build because it goes through the buffer protocol on
# `CompiledFn.call_batch_into`, which needs no NumPy binding at all.
parallel = ["alkahest-core/parallel"]
groebner = ["alkahest-core/groebner"]
groebner-cuda = ["alkahest-core/groebner-cuda"]
cuda = ["alkahest-core/cuda"]

[build-dependencies]
# Only to re-export PyO3's cfgs (Py_LIMITED_API / Py_3_11) — see build.rs.
pyo3-build-config = "0.21"

[dependencies]
alkahest-core = { path = "../alkahest-core", package = "alkahest-cas" }
pyo3.workspace = true
# default-features = false keeps rug's `complex` (and with it gmp-mpfr-sys's
# `mpc`, i.e. a system libmpc under `system-gmp`) out of the build; see
# alkahest-core/Cargo.toml.
rug = { version = "1", default-features = false, features = ["std", "integer", "rational"] }

[dev-dependencies]
