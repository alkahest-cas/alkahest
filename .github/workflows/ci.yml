name: CI

on:
    # `release/**` is included because a release branch accumulates merges that
    # would otherwise reach a tag with no CI at all: `pull_request` runs did not
    # fire for a PR based on `release/3.8.0`, and push only covered `main`, so
    # everything merged there was verified by local gates alone.
  push:
    branches: [main, 'release/**']
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily — triggers the nightly job
  workflow_dispatch:        # allow re-running nightly shards after CI fixes

# No job here reads or writes repository state through the API — these are
# build-and-test jobs only. They do run build scripts and test code from the
# head of a pull request, so the checkout token is dropped to read-only rather
# than left at whatever the repository default happens to be.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Tier 1a: PR checks (Rust + fast Python; stays well under the 6 h runner cap)
  tier1:
    name: Tier 1a — Rust + fast Python
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      # Built in docs.yml for Pages; committing it bloats the repo and drifts from sources.
      - name: No committed _site/ (generated docs bundle)
        run: |
          tracked=$(git ls-files _site || true)
          if [ -n "$tracked" ]; then
            echo "::error title=Committed generated site::_site/ must not be tracked. Remove with: git rm -r --cached _site && ensure _site/ is in .gitignore"
            echo "$tracked"
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev llvm-15-dev llvm-15

      - name: Create venv and install Python tooling
        run: |
          uv sync --no-install-project --group dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (egraph feature)
        run: cargo clippy --all-targets --features egraph -- -D warnings

      - name: cargo clippy (parallel feature)
        run: cargo clippy --all-targets --features parallel -- -D warnings

      # `cranelift` ships in the default PyPI wheel (PR #299) but had no clippy
      # step, so three lints accumulated in code every wheel user runs. It needs
      # no system LLVM — the backend is pure Rust — so it lints anywhere.
      - name: cargo clippy (cranelift feature)
        run: cargo clippy --all-targets --features cranelift -- -D warnings

      - name: cargo clippy (jit feature)
        run: cargo clippy --all-targets --features jit -- -D warnings

      # The CUDA-adjacent features were never linted, so lints accumulated
      # unnoticed until someone built them on a GPU box. cudarc uses
      # fallback-dynamic-loading, so this compiles on a runner with no CUDA
      # toolkit — only `libcuda.so.1` at *runtime* is unavailable, and clippy
      # never runs anything. The `cuda` feature additionally needs LLVM and is
      # linted in the GPU nightly instead.
      - name: cargo clippy (groebner-cuda feature)
        run: cargo clippy --all-targets --features groebner-cuda -- -D warnings

      # Linting the feature is not the same as running it. These tests need no
      # GPU: the ones that do skip themselves, and what remains is the part that
      # rots silently — the CPU-fallback accounting (`GpuBackendReport` with
      # `device_id: None` must report `fell_back_to_cpu()`), and the guarantee
      # that a driverless machine *skips* rather than aborts. `gpu_available()`
      # used to panic here, because cudarc panics rather than erroring when
      # `libcuda.so` is absent, so this suite failed on every machine without a
      # GPU — the exact configuration it claims to support.
      #
      # This is not GPU coverage: the GPU-dependent tests skip, and only the
      # dual-3090 box exercises a real kernel launch. It is the standing gate
      # against the CUDA paths breaking between those manual runs.
      - name: cargo test (groebner-cuda feature, no GPU present)
        run: cargo test --features "groebner groebner-cuda" -p alkahest-cas --test groebner_cuda

      - name: cargo test
        run: cargo test --all

      # `cargo test --all` builds without `egraph`, where `simplify_egraph` is a
      # no-op passthrough. The egraph proptests are `#[cfg(feature = "egraph")]`
      # and so never ran here at all, and the preservation tests passed
      # vacuously against the fallback. Without this step the egraph rewrite
      # engine has no effective test coverage in CI.
      - name: cargo test (egraph feature)
        run: cargo test -p alkahest-cas --features egraph

      - name: ruff check
        run: ruff check python/ tests/

      - name: ruff format --check
        run: ruff format --check python/ tests/

      # These are the exact features release-build.yml gives the default PyPI
      # wheel. Keep the two lists in lockstep: the whole point of this step is
      # that the pytest run below exercises the same binary users get, and
      # `parallel` is the feature where a mismatch is invisible — the `*_par`
      # entry points exist either way and just stop being parallel.
      - name: maturin develop (PyPI-parity features)
        run: maturin develop --manifest-path alkahest-py/Cargo.toml --features "groebner egraph cranelift parallel"

      - name: Capability smoke test (default-wheel parity)
        run: python -c "import alkahest as ak; f = ak.capabilities()['features']; assert f['cranelift_jit'] and f['parallel'] and not f['llvm_jit']; assert ak.jit_is_available()"

      - name: ty check
        run: ty check python/alkahest/

      # The certificate coverage table is generated by running a corpus, never
      # hand-maintained. If a change moves the certifiable surface without
      # regenerating the ledger, `capabilities()` and `certifiable()` would go
      # on advertising the old boundary — exactly the overclaim this ledger
      # exists to prevent. Fail here instead.
      - name: Certificate ledger drift check
        run: python scripts/gen_certificate_ledger.py --check

      # Its own step, ahead of the general suite: a silent error -- a confident,
      # plausible, mathematically wrong answer returned with no exception and no
      # verification flag -- is the one failure class that compounds. In an
      # autoresearch loop it is not one wrong answer, it is a false lemma every
      # downstream derivation inherits. Separating the step means a red gate is
      # identifiable from the job list without opening the pytest log; the step
      # prints the measured rate and per-subsystem breakdown either way.
      # See tests/silent_errors/README.md.
      - name: Silent-error gate (deterministic trap corpus)
        env:
          PYTHONUNBUFFERED: "1"
          ALKAHEST_SILENT_ERROR_REPORT: silent-error-summary.json
        run: pytest tests/silent_errors/ --timeout=300

      - name: Upload silent-error summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: silent-error-summary-${{ github.run_id }}
          path: silent-error-summary.json
          if-no-files-found: warn

      # --ignore=tests/silent_errors: already run by the dedicated step above.
      # It stays collected by a plain local `pytest tests/` -- the ignore is a
      # CI-only de-duplication, not an opt-in marker developers must remember.
      - name: pytest (default excludes @pytest.mark.slow sparse roadmap; see pytest.ini)
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest --timeout=900 --ignore=tests/silent_errors


  # ── AddressSanitizer, as its own job rather than a step inside Tier 1a.
  #
  # It was 467s of Tier 1a's ~1000s, which made it half the wait on every PR.
  # But CI wall-clock is the slowest *job*, not the sum of steps: run in
  # parallel it costs nothing on the critical path, so the coverage comes back
  # at PR time and Tier 1a still finishes first. Scoped to `-p alkahest-cas`
  # here for speed; the nightly `asan` shard runs the whole workspace.
  asan:
    name: AddressSanitizer — alkahest-cas
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # 90, not 60: with M10's Douglas-Rachford SOS certificate tests
    # (real::sos::psd, ~8.5 min under ASan) alongside M4's own suite, the full
    # `-p alkahest-cas --lib --tests` run measured ~48 min under ASan
    # instrumentation plus ~12 min of nightly-toolchain build-std setup,
    # landing right at the old 60-minute ceiling and getting cancelled
    # (not failed) mid-run. 90 gives real margin over the measured ~60 min
    # total, not just clearing it exactly.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly (for ASan)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
          components: rust-src

      - name: Install system dependencies
        run: sudo apt-get install -y libflint-dev llvm-15-dev llvm-15

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-asan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-asan-

      # --lib --tests: doc-test binaries link separately and do not receive the
      # ASan runtime under -Z build-std ("undefined symbol: __asan_init").
      # LSAN_OPTIONS=detect_leaks=0: leaks belong to the nightly lsan shard, and
      # the GMP/rug thread caches are false positives here.
      - name: cargo test (AddressSanitizer, alkahest-cas only)
        env:
          LSAN_OPTIONS: detect_leaks=0
        run: |
          RUSTFLAGS="-Zsanitizer=address" \
          cargo +nightly test -p alkahest-cas --lib --tests \
            --target x86_64-unknown-linux-gnu \
            -Z build-std

  # ── Wheel smoke: README quickstart + fresh-interpreter parse, against a
  # *built wheel* installed into its own clean venv -- not tier1's
  # `maturin develop` editable install of the source tree, and not pytest's
  # single shared process where an earlier test can import
  # alkahest.experimental (or otherwise warm up module state) before any
  # test touches parse(). That's exactly what previously masked a bug where
  # `alkahest.parse(...)` raised as the very first call in a genuinely
  # fresh interpreter (B1). This job also runs the README, which previously
  # caught stale/wrong quickstart output (B6). Exists so both classes of
  # bug are caught at PR time, not just on release.
  wheel-smoke:
    name: Wheel smoke — README quickstart + fresh-interpreter parse
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wheel-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wheel-smoke-

      - name: Install system dependencies
        run: sudo apt-get install -y libflint-dev

      # Deliberately a plain `maturin build` (real wheel) into its own venv,
      # not `maturin develop` -- see the job comment above for why.
      - name: Build wheel (PyPI-parity features)
        run: |
          python -m venv .venv-build
          .venv-build/bin/pip install -q -U pip maturin
          .venv-build/bin/maturin build --release --strip \
            --manifest-path alkahest-py/Cargo.toml \
            --features "egraph groebner cranelift parallel" \
            --out dist

      - name: Install wheel into a clean venv
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install -q dist/*.whl

      - name: README quickstart + fresh-interpreter parse smoke
        run: .venv-smoke/bin/python tests/smoke_readme.py

  # ── Tier 1b: slow Python integration (roadmap-level sparse_interp)
  # Runs on the nightly schedule only so push/PR CI stays fast; run locally with:
  #   pytest tests/test_sparse_interp.py -m slow --timeout=0 -v --override-ini="addopts=-v"
  # Runs on PRs as well as nightly. It was nightly-only because the
  # sparse_interp roadmap case took long enough to matter; #292 replaced the
  # recursive formulation with Zippel's iterative algorithm and the whole job is
  # now about a minute, of which the tests are half a second. Running in
  # parallel it costs nothing on the critical path, and it guards the oracle
  # call-count property — the thing a regression there would silently undo.
  tier1-python-slow:
    name: Tier 1b — Python slow tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev llvm-15-dev llvm-15

      - name: Create venv and install Python tooling
        run: |
          uv sync --no-install-project --group dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: maturin develop
        run: maturin develop --manifest-path alkahest-py/Cargo.toml --features "groebner egraph"

      # Scan only sparse_interp tests — full `pytest -m slow` imports every module under
      # `tests/` during collection (needs hypothesis, sympy, …).
      - name: pytest (slow only)
        env:
          PYTHONUNBUFFERED: "1"
        # Undo pytest.ini addopts (-m "not slow") so -m slow can match the roadmap test.
        #
        # A real per-test timeout, not `--timeout=0`. With the timeout disabled a
        # single non-terminating test consumed the whole 6 h job cap and the job
        # reported nothing at all -- every night. A bounded timeout turns that
        # into a fast, named failure.
        run: pytest tests/test_sparse_interp.py -m slow --timeout=900 -v --override-ini="addopts=-v"

  # ── Tier 2: Nightly integration (cron on main) ─────────────────────────────
  # Split into parallel shards so each GitHub-hosted job stays under the 6 h cap.
  nightly:
    name: Nightly (${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard:
          - asan
          - proptest
          - hypothesis
          - tsan
          - lsan
          - valgrind
          - fuzz-expr
          - fuzz-simplifier
          - extras

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        if: >-
          matrix.shard == 'proptest' || matrix.shard == 'hypothesis' ||
          matrix.shard == 'fuzz-expr' || matrix.shard == 'fuzz-simplifier' ||
          matrix.shard == 'extras'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust nightly
        if: >-
          matrix.shard == 'asan' || matrix.shard == 'tsan' ||
          matrix.shard == 'lsan' || matrix.shard == 'valgrind'
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
          components: rust-src

      - uses: actions/setup-python@v6
        if: matrix.shard == 'hypothesis' || matrix.shard == 'extras'
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        if: matrix.shard == 'hypothesis' || matrix.shard == 'extras'

      - name: Create venv (hypothesis / extras)
        if: matrix.shard == 'hypothesis' || matrix.shard == 'extras'
        run: |
          uv sync --no-install-project --group dev --group ci-extras
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev llvm-15-dev llvm-15

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-${{ matrix.shard }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Deep proptest
        if: matrix.shard == 'proptest'
        env:
          PROPTEST_CASES: "50000"
        run: cargo test --all --release

      - name: Deep hypothesis
        if: matrix.shard == 'hypothesis'
        env:
          HYPOTHESIS_MAX_EXAMPLES: "5000"
        run: |
          maturin develop --manifest-path alkahest-py/Cargo.toml --features "groebner egraph"
          pytest tests/

      # `--features parallel` is the whole point of this shard and was missing.
      # Without it `rayon` and `dashmap` are not even compiled in: `ExprPool`'s
      # index is a plain `Mutex<HashMap>`, `simplify_par` / `simplify_redex` /
      # `simplify_auto` do not exist, `CompiledFn::call_batch_par` does not
      # exist, and F4 reduces sequentially. ThreadSanitizer was therefore
      # running over a build with essentially no concurrency in it and
      # reporting a clean bill for code it had never seen — while `parallel`
      # ships in the default PyPI wheel.
      #
      # `alkahest-core/tests/parallel_stress.rs` exists to give this shard
      # something to sanitize: it drives concurrent interning, concurrent
      # `simplify_par` / `simplify_redex` on one shared pool, and nested
      # `call_batch_par` from real OS threads. `egraph` is left off — it pulls
      # in egglog, which is single-threaded here and only lengthens the build.
      - name: ThreadSanitizer
        if: matrix.shard == 'tsan'
        env:
          # TSan instrumentation inflates every stack frame, and the parallel
          # simplifier's stack governor (`with_stack_segment` in
          # `simplify/parallel.rs`) is calibrated against Rayon's *default*
          # 2 MiB worker stack: it refills at 512 KiB used, which leaves ample
          # room for an uninstrumented frame and not enough for an instrumented
          # one. Without this the shard dies with a bare SIGSEGV — a stack
          # overflow, not a race, and one that does not reproduce in a normal
          # build (`cargo test --workspace --release --features parallel` is
          # green). `RUST_MIN_STACK` is what `std::thread`'s default stack size
          # reads, so it reaches the Rayon workers.
          RUST_MIN_STACK: "33554432"
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tsan.supp
        run: |
          # Name-based suppressions only match a *symbolized* stack — the same
          # trap the lsan shard hit, where unsymbolized `alkahest_cas+0x…`
          # frames made every entry in lsan.supp dead. The sanitizer runtime
          # takes the symbolizer from the options string, not from
          # LLVM_SYMBOLIZER_PATH, so append it there.
          for candidate in /usr/lib/llvm-15/bin/llvm-symbolizer /usr/bin/llvm-symbolizer-15 /usr/bin/llvm-symbolizer; do
            if [ -x "$candidate" ]; then
              export TSAN_OPTIONS="${TSAN_OPTIONS}:external_symbolizer_path=$candidate"
              break
            fi
          done
          echo "TSAN_OPTIONS=$TSAN_OPTIONS"
          RUSTFLAGS="-Zsanitizer=thread" \
          cargo +nightly test --workspace --lib --tests \
            --features parallel \
            --target x86_64-unknown-linux-gnu \
            -Z build-std

      - name: LeakSanitizer
        if: matrix.shard == 'lsan'
        env:
          # Prefer the real binary from llvm-15-tools; the /usr/bin/llvm-symbolizer-15
          # alternative is missing on some Ubuntu noble images, leaving stacks
          # unsymbolized so lsan.supp (mpfr_*/__gmp*) never matches.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/lsan.supp:symbolize=1:fast_unwind_on_malloc=0
        run: |
          for candidate in /usr/lib/llvm-15/bin/llvm-symbolizer /usr/bin/llvm-symbolizer-15 /usr/bin/llvm-symbolizer; do
            if [ -x "$candidate" ]; then
              export LLVM_SYMBOLIZER_PATH="$candidate"
              break
            fi
          done
          if [ -z "${LLVM_SYMBOLIZER_PATH:-}" ]; then
            echo "error: no llvm-symbolizer found; LSAN suppressions will not match" >&2
            exit 1
          fi
          echo "Using LLVM_SYMBOLIZER_PATH=$LLVM_SYMBOLIZER_PATH"
          # The sanitizer runtime reads the symbolizer from the *options string*
          # (`external_symbolizer_path=`), not from LLVM_SYMBOLIZER_PATH. Without
          # it every frame is reported as `alkahest_cas+0x...` with no symbol, so
          # the name-based entries in lsan.supp (`__gmp_default_allocate`,
          # `mpfr_*`, `flint_*`) match nothing and the intentional GMP/MPFR caches
          # are reported as leaks. Append it to whatever LSAN_OPTIONS already holds.
          export LSAN_OPTIONS="${LSAN_OPTIONS}:external_symbolizer_path=$LLVM_SYMBOLIZER_PATH"
          echo "LSAN_OPTIONS=$LSAN_OPTIONS"
          RUSTFLAGS="-Zsanitizer=leak" \
          cargo +nightly test --workspace --lib --tests \
            --target x86_64-unknown-linux-gnu \
            -Z build-std

      # Moved out of Tier 1a, where it was 467s of a ~1000s job — nearly half
      # the time a contributor waits on a PR — for a check whose value is depth
      # rather than immediacy. Nightly can also afford the *whole workspace*
      # rather than the `-p alkahest-cas` subset Tier 1a was scoped to.
      - name: cargo test (AddressSanitizer)
        if: matrix.shard == 'asan'
        # --lib --tests: doc-test binaries link separately and do not receive the
        # ASan runtime under -Z build-std ("undefined symbol: __asan_init").
        # LSAN_OPTIONS=detect_leaks=0: leaks are the `lsan` shard's job, and the
        # GMP/rug thread caches are false positives here.
        #
        # `--features parallel` for the same reason the `tsan` shard needs it:
        # `parallel` is not a default feature, so without it rayon and dashmap
        # are not compiled in and the sharded `ExprPool`, `simplify_par` and
        # `call_batch_par` do not exist. ASan was checking memory safety on a
        # build with no concurrent code in it, which is exactly the code whose
        # memory safety is hardest to get right. Nightly-only: this shard is
        # already off the PR critical path, so the extra build cost is free
        # where it would not be in Tier 1a.
        #
        # RUST_MIN_STACK for the same reason the `tsan` shard sets it, and it is
        # load-bearing here too: the 2026-08-14 nightly — the first ASan run to
        # see the parallel code — died with
        # `AddressSanitizer: stack-overflow ... T1601`, on a rayon worker rather
        # than the main thread. It is not corruption. `simplify::dispatch`'s
        # stack governor refills at 512 KiB, ASan's instrumented frames are far
        # fatter than the uninstrumented ones that margin was tuned for, and
        # rayon workers start from a 2 MiB default rather than the main thread's
        # 8 MiB. Raising the worker stack fixes it deterministically and it does
        # not reproduce uninstrumented.
        env:
          LSAN_OPTIONS: detect_leaks=0
          RUST_MIN_STACK: "33554432"
        run: |
          RUSTFLAGS="-Zsanitizer=address" \
          cargo +nightly test --workspace --lib --tests \
            --features parallel \
            --target x86_64-unknown-linux-gnu \
            -Z build-std

      - name: Install Valgrind
        if: matrix.shard == 'valgrind'
        # Without `update` the runner's package index is stale and the fetch
        # 404s ("Unable to fetch some archives"), killing this shard in ~30 s.
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Valgrind — Rust/C FFI boundary
        if: matrix.shard == 'valgrind'
        env:
          RUSTFLAGS: "-C debuginfo=2 -Z dwarf-version=4"
        run: |
          # Ask cargo which executables it produced instead of globbing a path.
          # The previous version globbed `target/<triple>/debug/deps/alkahest_cas-*`
          # after a `cargo build`, which produces no test binaries at all — so the
          # loop body never ran and the shard reported success having valgrinded
          # nothing. Switching to `test --no-run` fixed the build but the glob
          # still missed, because `-Z build-std` does not place them where the
          # path assumed. `--message-format=json` reports the real paths, so
          # there is nothing left to drift.
          cargo +nightly test --no-run --all \
            --target x86_64-unknown-linux-gnu -Z build-std \
            --message-format=json > /tmp/cargo-test.json
          mapfile -t bins < <(
            jq -r 'select(.profile.test == true) | .executable | select(. != null)' \
              /tmp/cargo-test.json | grep alkahest_cas
          )
          # Scope to the FFI boundary this step is named for. Valgrinding every
          # unit test in a -Z build-std debug build took 2h49m of the 6h budget
          # on its first real run, which ties up a runner for most of a night to
          # re-check pure-Rust logic the other shards already cover. The tests
          # that actually cross into GMP/MPFR/FLINT are the ones worth the 20-50x
          # slowdown.
          #
          # libtest takes filters as separate positional arguments and matches
          # them as substrings, not as one regex — a single "a|b" argument would
          # match nothing, run zero tests, and report clean. Set
          # ALKAHEST_VALGRIND_FILTER (space separated) to override, or empty for
          # a full sweep.
          read -r -a filters <<< "${ALKAHEST_VALGRIND_FILTER-ball:: flint rug number_theory:: lattice:: validated::}"
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "::error title=Valgrind ran nothing::cargo reported no alkahest_cas test executables" >&2
            jq -r 'select(.executable != null) | .executable' /tmp/cargo-test.json >&2 || true
            exit 1
          fi
          for bin in "${bins[@]}"; do
            echo "== valgrind $bin"
            # --errors-for-leak-kinds=definite,indirect: fail on real leaks and
            # on any memory-safety error, but not on "possibly lost". The first
            # real run of this gate reported 0 definite and 0 indirect bytes and
            # four "possibly lost" records — a thread-local Thread handle, MPFR's
            # const_log2 cache, and two hashbrown tables. Those are interior
            # pointers into intentional caches and process-lifetime globals, not
            # defects, and suppressing them by stack shape would be four brittle
            # rules that rot the first time an inlining decision changes.
            # An invalid read/write, or a definitely-lost block, still fails.
            # Tee so the run can be asserted on: a filter that matches nothing
            # would execute zero tests and valgrind would report a clean bill,
            # which is precisely the shape of gate this shard just stopped being.
            valgrind --leak-check=full --error-exitcode=1 \
              --errors-for-leak-kinds=definite,indirect \
              --show-leak-kinds=definite,indirect,possible \
              --suppressions=valgrind.supp "$bin" "${filters[@]}" 2>&1 | tee /tmp/vg-out.txt
            ran=$(grep -oE '^test result: ok\. [0-9]+ passed' /tmp/vg-out.txt | grep -oE '[0-9]+' | head -1)
            echo "tests executed under valgrind: ${ran:-0}"
            if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
              echo "::error title=Valgrind executed no tests::filter matched nothing in $bin" >&2
              exit 1
            fi
          done
          echo "valgrind ran over ${#bins[@]} test binary/binaries"

      - name: Install cargo-afl
        if: matrix.shard == 'fuzz-expr' || matrix.shard == 'fuzz-simplifier'
        run: cargo install cargo-afl

      - name: AFL++ fuzzing — expr builder (2 h cap)
        if: matrix.shard == 'fuzz-expr'
        env:
          # Lets AFL proceed even if core_pattern could not be changed, instead
          # of refusing to start. AFL_SKIP_CPUFREQ likewise: the runner exposes
          # no CPU governor and AFL treats that as fatal.
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_SKIP_CPUFREQ: "1"
        run: |
          if [ -f fuzz/src/bin/fuzz_expr_builder.rs ]; then
            # AFL refuses to start unless the kernel core_pattern points at a
            # file rather than a pipe. Without this it printed its instructions,
            # exited non-zero, and `|| true` turned that into a green tick — the
            # shard "passed" having executed zero test cases.
            #
            # `system-config` runs sudo *internally* (it says so in the message
            # AFL prints), so it must NOT be prefixed with sudo: cargo lives in
            # ~/.cargo/bin, which sudo's secure_path does not include. Best
            # effort, because the env fallback below covers it either way.
            cargo afl system-config || echo "system-config failed; relying on AFL_* fallbacks"
            cargo afl build --manifest-path fuzz/Cargo.toml --bin fuzz_expr_builder
            # `fuzz/out/` is gitignored, so it does not exist in a fresh
            # checkout and AFL cannot create a nested path under a missing
            # parent: it aborted with
            #   SYSTEM ERROR : Unable to create 'fuzz/out/expr_builder'
            # *after* clearing the core_pattern hurdle.
            mkdir -p fuzz/out
            # A missing seed corpus would make AFL exit instantly, which the
            # execs_done check would catch — but the message would be obscure.
            if [ ! -d fuzz/in/expr_builder ] || [ -z "$(ls -A fuzz/in/expr_builder 2>/dev/null)" ]; then
              echo "::error title=No seed corpus::fuzz/in/expr_builder is missing or empty" >&2
              exit 1
            fi
            # `fuzz/` is excluded from the root workspace (see Cargo.toml), so
            # `--manifest-path fuzz/Cargo.toml` builds into `fuzz/target/`, not
            # `target/`. The hardcoded `target/debug/fuzz_expr_builder` produced
            #   PROGRAM ABORT : Program ... not found or not executable
            # Resolve it instead of assuming, and say what was built if not.
            bin=$(find fuzz/target target -type f -name fuzz_expr_builder -perm -u+x 2>/dev/null | head -1)
            if [ -z "$bin" ]; then
              echo "::error title=Fuzz binary not found::fuzz_expr_builder was not produced" >&2
              find fuzz/target target -maxdepth 3 -type f -perm -u+x 2>/dev/null | head -20 >&2
              exit 1
            fi
            echo "fuzzing $bin"
            set +e
            timeout 7200 cargo afl fuzz \
              -i fuzz/in/expr_builder -o fuzz/out/expr_builder \
              "$bin"
            status=$?
            set -e
            # 124 is `timeout` doing its job after the 2 h cap; 0 means AFL
            # chose to stop. Anything else is a real failure and must not be
            # swallowed.
            if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
              echo "::error title=AFL exited abnormally::status $status" >&2
              exit "$status"
            fi
            # A fuzzer that ran zero executions is not a passing fuzz job.
            stats=fuzz/out/expr_builder/default/fuzzer_stats
            if [ ! -f "$stats" ]; then
              echo "::error title=AFL produced no stats::$stats missing" >&2
              exit 1
            fi
            execs=$(awk '/^execs_done/ {print $3}' "$stats")
            echo "AFL executions: $execs"
            if [ -z "$execs" ] || [ "$execs" -eq 0 ]; then
              echo "::error title=AFL executed nothing::execs_done=$execs" >&2
              exit 1
            fi
          fi

      - name: AFL++ fuzzing — simplifier (2 h cap)
        if: matrix.shard == 'fuzz-simplifier'
        env:
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_SKIP_CPUFREQ: "1"
        run: |
          if [ -f fuzz/src/bin/fuzz_simplifier.rs ]; then
            # AFL refuses to start unless the kernel core_pattern points at a
            # file rather than a pipe. Without this it printed its instructions,
            # exited non-zero, and `|| true` turned that into a green tick — the
            # shard "passed" having executed zero test cases.
            #
            # `system-config` runs sudo *internally* (it says so in the message
            # AFL prints), so it must NOT be prefixed with sudo: cargo lives in
            # ~/.cargo/bin, which sudo's secure_path does not include. Best
            # effort, because the env fallback below covers it either way.
            cargo afl system-config || echo "system-config failed; relying on AFL_* fallbacks"
            cargo afl build --manifest-path fuzz/Cargo.toml --bin fuzz_simplifier
            # `fuzz/out/` is gitignored, so it does not exist in a fresh
            # checkout and AFL cannot create a nested path under a missing
            # parent: it aborted with
            #   SYSTEM ERROR : Unable to create 'fuzz/out/simplifier'
            # *after* clearing the core_pattern hurdle.
            mkdir -p fuzz/out
            # A missing seed corpus would make AFL exit instantly, which the
            # execs_done check would catch — but the message would be obscure.
            if [ ! -d fuzz/in/simplifier ] || [ -z "$(ls -A fuzz/in/simplifier 2>/dev/null)" ]; then
              echo "::error title=No seed corpus::fuzz/in/simplifier is missing or empty" >&2
              exit 1
            fi
            # `fuzz/` is excluded from the root workspace (see Cargo.toml), so
            # `--manifest-path fuzz/Cargo.toml` builds into `fuzz/target/`, not
            # `target/`. The hardcoded `target/debug/fuzz_simplifier` produced
            #   PROGRAM ABORT : Program ... not found or not executable
            # Resolve it instead of assuming, and say what was built if not.
            bin=$(find fuzz/target target -type f -name fuzz_simplifier -perm -u+x 2>/dev/null | head -1)
            if [ -z "$bin" ]; then
              echo "::error title=Fuzz binary not found::fuzz_simplifier was not produced" >&2
              find fuzz/target target -maxdepth 3 -type f -perm -u+x 2>/dev/null | head -20 >&2
              exit 1
            fi
            echo "fuzzing $bin"
            set +e
            timeout 7200 cargo afl fuzz \
              -i fuzz/in/simplifier -o fuzz/out/simplifier \
              "$bin"
            status=$?
            set -e
            # 124 is `timeout` doing its job after the 2 h cap; 0 means AFL
            # chose to stop. Anything else is a real failure and must not be
            # swallowed.
            if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
              echo "::error title=AFL exited abnormally::status $status" >&2
              exit "$status"
            fi
            # A fuzzer that ran zero executions is not a passing fuzz job.
            stats=fuzz/out/simplifier/default/fuzzer_stats
            if [ ! -f "$stats" ]; then
              echo "::error title=AFL produced no stats::$stats missing" >&2
              exit 1
            fi
            execs=$(awk '/^execs_done/ {print $3}' "$stats")
            echo "AFL executions: $execs"
            if [ -z "$execs" ] || [ "$execs" -eq 0 ]; then
              echo "::error title=AFL executed nothing::execs_done=$execs" >&2
              exit 1
            fi
          fi

      - name: Oracle + benches + cross-CAS + artifact upload
        if: matrix.shard == 'extras'
        env:
          RUN_COMMERCIAL_CAS: "1"
        run: |
          maturin develop --manifest-path alkahest-py/Cargo.toml --features "groebner egraph"
          if [ -f tests/test_oracle.py ]; then
            timeout 45m pytest tests/test_oracle.py -v
          fi
          # Each of these is individually bounded. Previously the step as a whole
          # ran until the 6 h job cap and uploaded nothing: `|| true` swallows a
          # non-zero exit but does nothing about a command that simply never
          # returns, and `cargo bench --all` over this workspace does not finish.
          # `timeout ... || true` keeps the shard best-effort *and* bounded, so
          # the artifact upload below is always reached.
          timeout 90m cargo bench --all 2>&1 | tee bench.log || true
          timeout 10m python benchmarks/criterion_to_report.py --output criterion_report.html || true
          timeout 60m python benchmarks/cas_comparison.py --competitors --output results.jsonl || true

      - name: Upload benchmark artifacts
        if: always() && matrix.shard == 'extras'
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.run_id }}
          path: |
            results.jsonl
            criterion_report.html
            criterion_summary.json
          if-no-files-found: ignore
