# V5-9: CUDA compute-sanitizer nightly CI
# Runs memcheck and racecheck on CUDA tests. Requires self-hosted GPU runner.
name: CUDA Nightly (compute-sanitizer)

# NOT SCHEDULED. This job targets `[self-hosted, gpu-3090]`, and no such runner
# is registered — a scheduled run does not fail, it queues forever, so the
# schedule produced a permanently pending job on `main` and no signal either
# way. `workflow_dispatch` is kept so it can be run the moment a GPU runner
# exists, and the file is kept because it is the specification for running
# these suites: an agent on a GPU box follows it step for step.
#
# Until a runner is registered, the CUDA surface is verified by hand on GPU
# hardware. As of 3.8.0 that run passed: 17 Rust CUDA tests, 17/17 in
# `tests/test_cuda.py`, memcheck and racecheck clean, and GPU/CPU agreement
# within 0-2 ulp checked against numpy's own ufuncs (not `numpy_eval`, which
# shares the Cranelift backend and is therefore not an independent oracle).
on:
  workflow_dispatch:

jobs:
  cuda-sanitizer:
    name: CUDA memcheck + racecheck
    runs-on: [self-hosted, gpu-3090]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Linted here rather than in main CI because `cuda` pulls in the LLVM
      # JIT, which the ordinary runners are not provisioned for.
      - name: cargo clippy (cuda + groebner-cuda)
        run: cargo clippy --all-targets --features cuda,groebner-cuda -- -D warnings

      - name: Build and run CUDA tests
        env:
          ALKAHEST_GPU_TESTS: "1"
        run: cargo test --features cuda,groebner-cuda --no-fail-fast

      # The Python surface of the CUDA feature had never been built by any CI
      # job: this workflow ran `cargo` only. That is how `ak.compile_cuda` came
      # to raise AttributeError on a build whose own capabilities() advertised
      # `cuda: true`, and survived three releases — the Rust tests all passed
      # the entire time, because the gap was in the re-export, not the kernel.
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Create venv and install Python tooling
        run: |
          uv sync --no-install-project --group dev
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV

      - name: maturin develop (cuda + groebner-cuda)
        run: maturin develop --manifest-path alkahest-py/Cargo.toml --features "groebner egraph cuda groebner-cuda"

      # ALKAHEST_GPU_TESTS=1 makes the device probe assert rather than skip, so
      # a missing or broken GPU fails here instead of quietly reporting green.
      - name: pytest (CUDA surface)
        env:
          ALKAHEST_GPU_TESTS: "1"
        run: pytest tests/test_cuda.py -v

      # The capability contract is only falsifiable on a build that has the
      # feature; on every other runner these assertions are vacuously true.
      - name: Capability contract on a real CUDA build
        run: pytest tests/test_agent_contract.py -v

      # Both sanitizer steps are scoped to the two integration targets that
      # actually launch kernels. Wrapping the whole `cargo test` instead drags
      # rustdoc's doc-test runner under the sanitizer, where it segfaults
      # (SIGSEGV, exit 139) *after* the CUDA suites have passed but *before*
      # the summary is printed — so racecheck produced no RACECHECK SUMMARY at
      # all, and with `continue-on-error: true` that looked like a pass.
      # Scoping costs no coverage: the only GPU work in the workspace lives in
      # these two targets. The in-`src` unit tests reach `compile_cuda` for PTX
      # generation only, and `compute_groebner_basis_gpu(.., None)` takes the
      # `reduce_cpu` path, so neither issues a CUDA API call.
      - name: Run compute-sanitizer memcheck
        env:
          ALKAHEST_GPU_TESTS: "1"
        run: |
          # --target-processes all is load-bearing: the default is
          # application-only, which instruments `cargo` — a process that makes
          # no CUDA calls whatsoever. Without it this step emits a banner, no
          # ERROR SUMMARY, and a green tick while checking nothing.
          compute-sanitizer --target-processes all --tool memcheck \
            cargo test --features cuda,groebner-cuda --no-fail-fast \
              --test nvptx_gpu --test groebner_cuda \
              -- --skip requested_device_that_does_not_exist_falls_back_and_records_why \
                 --skip cuda_device_count_matches_the_ordinals_that_launch
        continue-on-error: false

      # Promoted to a gate: it is clean on real hardware (0 hazards, twice, on
      # 2x RTX 3090), and it was never the false-positive risk the old comment
      # assumed — but read the coverage note before trusting a green tick here.
      #
      # racecheck detects hazards on __shared__ memory, and no kernel in this
      # workspace uses any: the hand-written `ELIMINATE_ROW_PTX` declares no
      # `.shared`, `compile_cuda`'s generated PTX declares none, and launches
      # pass `shared_mem_bytes: 0`. So today this step *cannot* fail, and its
      # green tick is a statement about the absence of shared memory, not about
      # the absence of races. It is a gate for the first kernel that introduces
      # `__shared__` — which is precisely when it starts being able to fail, and
      # when nobody would think to add it.
      #
      # Left enabled rather than deleted because the cost is ~4 s and the
      # alternative is remembering. Named for what it checks so a reader does
      # not over-read the result; `continue-on-error: false` so that the day it
      # does have something to say, it is heard.
      - name: Run compute-sanitizer racecheck (__shared__ hazards; none today)
        env:
          ALKAHEST_GPU_TESTS: "1"
        run: |
          compute-sanitizer --target-processes all --tool racecheck \
            cargo test --features cuda,groebner-cuda \
              --test nvptx_gpu --test groebner_cuda \
              -- --skip requested_device_that_does_not_exist_falls_back_and_records_why \
                 --skip cuda_device_count_matches_the_ordinals_that_launch
        continue-on-error: false

      # initcheck earns its gate the way memcheck did — by being made to fail.
      # Copying only half the input buffer while allocating all of it (so every
      # access stays in bounds and memcheck stays silent) turned
      # `ERROR SUMMARY: 0 errors` into 524288, every one of them reported at
      # `alkahest_eval+0x...`: the generated kernel, by name and offset. It is
      # reading kernel instructions, and it has real coverage here because both
      # kernels read global memory the host is responsible for filling.
      - name: Run compute-sanitizer initcheck (uninitialised __global__ reads)
        env:
          ALKAHEST_GPU_TESTS: "1"
        run: |
          compute-sanitizer --target-processes all --tool initcheck \
            cargo test --features cuda,groebner-cuda \
              --test nvptx_gpu --test groebner_cuda \
              -- --skip requested_device_that_does_not_exist_falls_back_and_records_why \
                 --skip cuda_device_count_matches_the_ordinals_that_launch
        continue-on-error: false

      # synccheck is in the same position as racecheck, and the honest summary
      # is that it could not be validated. It detects barrier and warp-sync
      # misuse, and no kernel here emits a single `bar.sync`: not the
      # hand-written `ELIMINATE_ROW_PTX`, not `compile_cuda`'s output.
      #
      # Unlike memcheck and initcheck, no positive control could make it report.
      # Injecting a divergent `bar.sync 0` produced nothing — since Volta,
      # exited threads are not required to participate, so that is not actually
      # a violation — and neither did `bar.warp.sync -1` with threads branched
      # away. What *is* established is that the tool attaches: with no kernel
      # launched it says "Target application terminated before first
      # instrumented API call" and prints no summary, so its `0 errors` on a
      # real run distinguishes "ran, found nothing" from "never ran".
      #
      # Kept on the same terms as racecheck: named for its scope, enabled so it
      # has teeth for the first kernel that synchronises. Until then a green
      # tick here means "no barriers", nothing more.
      - name: Run compute-sanitizer synccheck (barrier misuse; no barriers today)
        env:
          ALKAHEST_GPU_TESTS: "1"
        run: |
          compute-sanitizer --target-processes all --tool synccheck \
            cargo test --features cuda,groebner-cuda \
              --test nvptx_gpu --test groebner_cuda \
              -- --skip requested_device_that_does_not_exist_falls_back_and_records_why \
                 --skip cuda_device_count_matches_the_ordinals_that_launch
        continue-on-error: false

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-logs-${{ github.run_id }}
          path: |
            /tmp/sanitizer-*.log
          retention-days: 30
