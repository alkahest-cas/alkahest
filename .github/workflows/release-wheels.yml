name: Release wheels

# Reusable workflow: builds and smoke-tests the release wheels. Publishes
# nothing and needs nothing but a read-only token. Every job declares
# `contents: read`.
#
# Callers:
#   * release-build.yml. After a merge, on a tag, or on dispatch it calls this
#     workflow twice: once for the default wheels, once with
#     `optional_variants: true` for the +jit / +full ones. The upload jobs
#     stay in release-build.yml itself, because PyPI's trusted publisher is
#     bound to that workflow filename and the `release` environment.
#   * release-wheel-smoke.yml. On an open PR it calls with `pr_smoke: true`,
#     which builds one manylinux x86_64 py3.12 wheel and one Windows py3.12 wheel
#     exactly as a release does, and smoke-tests them. (aarch64 and the sdist
#     are on the full matrix: a release, or workflow_dispatch of that workflow.) release-build.yml's
#     `pull_request` trigger fires only after a merge, so without this a
#     wheel-only break (#395's PyIndex_Check, fixed in #419) stayed
#     invisible to PR CI for 13 merges.

on:
  workflow_call:
    inputs:
      pr_smoke:
        description: Build and smoke-test a reduced matrix (Linux x86_64 + Windows, py3.12) only.
        type: boolean
        default: false
      optional_variants:
        description: Build the +jit / +full Linux wheels instead of the default ones.
        type: boolean
        default: false

permissions:
  contents: read

env:
  # On merged PRs, build the merge commit on main (not the PR head). A
  # pr_smoke call builds the PR's test merge commit (github.sha), which is what
  # the post-merge build would see if the PR merged now. (`github` here is the
  # caller's context.)
  RELEASE_REF: ${{ inputs.pr_smoke && github.sha || github.event.pull_request.merge_commit_sha || github.sha }}
  # One maturin for every wheel and the sdist. The container gets it from PyPI.
  MATURIN_VERSION: "1.16.0"

jobs:
  # Linux: per architecture, one job builds all Python versions at once, inside a
  # manylinux_2_28 Docker image that ships Python 3.9–3.14. The matrix python on
  # the host runner is NOT visible inside Docker, so a per-version matrix would
  # all produce the same wheel. Each interpreter is passed explicitly because
  # --find-interpreter also matches PyPy.
  #
  # aarch64 runs on a native ARM runner (GitHub-hosted, free for public
  # repositories) rather than under QEMU: the wheel's smoke test needs real
  # aarch64 anyway, and FLINT plus the crate take far longer emulated.
  build-linux:
    name: wheels / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    if: ${{ !inputs.optional_variants }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is on the full matrix only; a pr_smoke call stays x86_64.
        include: ${{ fromJSON(inputs.pr_smoke && '[{"runner":"ubuntu-22.04","image":"quay.io/pypa/manylinux_2_28_x86_64:latest"}]' || '[{"runner":"ubuntu-22.04","image":"quay.io/pypa/manylinux_2_28_x86_64:latest"},{"runner":"ubuntu-24.04-arm","image":"quay.io/pypa/manylinux_2_28_aarch64:latest"}]') }}
    env:
      # PyO3 0.21 supports up to 3.12; this allows 3.13 and 3.14 via the stable ABI.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      # The smoke steps below install the wheel into *this* interpreter, and
      # every build includes python3.12.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Rust, maturin, GMP, MPFR and FLINT all come from inside the container;
      # see .github/scripts/build-manylinux-wheels.sh for why this is not
      # PyO3/maturin-action.
      - name: Build wheels (manylinux_2_28, all Python versions)
        env:
          IMAGE: ${{ matrix.image }}
          # 3.13 and 3.14 build through PYO3_USE_ABI3_FORWARD_COMPATIBILITY
          # (PyO3 0.21 natively supports up to 3.12).
          INTERPRETERS: ${{ inputs.pr_smoke && 'python3.12' || 'python3.9 python3.10 python3.11 python3.12 python3.13 python3.14' }}
          FEATURES: egraph,groebner,cranelift,parallel,system-gmp
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull "$IMAGE" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
          docker run --rm -v "$PWD:/io" -w /io \
            -e MATURIN_VERSION -e INTERPRETERS -e FEATURES \
            -e PYO3_USE_ABI3_FORWARD_COMPATIBILITY \
            "$IMAGE" bash .github/scripts/build-manylinux-wheels.sh

      # The default wheel must run on any CPU of its architecture (see the
      # portable-flags notes in build-manylinux-deps.sh).
      - name: Bundled FLINT/MPFR use no CPU-specific vector code
        run: python scripts/check_wheel_isa.py dist/*.whl

      - name: Smoke test
        run: |
          pip install --no-index --find-links dist alkahest
          # Heredoc (not python -c) so bash does not strip Python "..." quotes.
          python - <<'PY'
          import alkahest as ak
          p = ak.ExprPool()
          # A bignum through the number-conversion path: #395's
          # PyIndex_Check bound to a PyPy-only symbol and broke exactly this.
          assert str(p.integer(10**30)) == str(10**30)
          x = p.symbol('x')
          print(ak.simplify(x + 0).value)
          print(ak.simplify_egraph(x + 0).value)
          assert hasattr(ak, 'solve'), 'expected groebner APIs in default wheel'
          # `system-gmp` is opt-in for source builds but every wheel ships it.
          assert ak.alkahest.GMP_SHARED_WITH_FLINT, 'wheel built without system-gmp'
          f = ak.capabilities()["features"]
          # `numpy` and `groebner_cuda` are deliberately absent (contract v3):
          # neither named anything a Python caller could reach.
          assert f == {
              "egraph": True, "groebner": True, "jit": False,
              "cranelift": True, "llvm_jit": False, "cranelift_jit": True,
              "parallel": True, "cuda": False,
              # Not Cargo features: build.rs probes libflint. The
              # before-script refuses a FLINT without acb_theta, so both hold.
              "arb_backend": True, "riemann_theta": True,
          }
          assert ak.jit_is_available(), "expected Cranelift JIT in default wheel"
          print('default wheel ok (groebner + cranelift + parallel)')
          PY

      # Real user-perspective check: the capability-flag smoke test above already
      # calls several other alkahest APIs before this point, so on its own it
      # cannot catch a bug that only reproduces when parse() is the FIRST thing
      # a fresh interpreter asks the installed wheel to do (see B1 -- masked in
      # the old test suite because an earlier test happened to import
      # alkahest.experimental first). It also never executed the README, so
      # stale/wrong quickstart output (see B6) went unnoticed.
      # tests/smoke_readme.py runs in its own fresh `python` process against
      # the wheel just installed above (no maturin develop / editable install
      # involved) to close both gaps.
      - name: README quickstart + fresh-interpreter parse smoke
        run: python tests/smoke_readme.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}
          path: dist/*.whl

  # The source distribution: what `pip install alkahest` falls back to where no
  # wheel matches. Full-matrix only, like aarch64.
  build-sdist:
    name: sdist / ubuntu-24.04
    runs-on: ubuntu-24.04
    if: ${{ !inputs.optional_variants && !inputs.pr_smoke }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install "maturin==$MATURIN_VERSION"

      - name: Build the sdist
        run: maturin sdist --out dist

      - name: Sdist has what a build needs and nothing else
        run: python .github/scripts/check_sdist.py dist/*.tar.gz

      # build.rs has a message for this; what matters is that it survives
      # maturin and pip and reaches the person who ran `pip install`. Before
      # FLINT is set up, deliberately: this runner image has no libflint.
      - name: Without FLINT, pip fails and says why
        run: |
          if ldconfig -p | grep libflint; then
            echo "::error::this runner already has FLINT, so the check below proves nothing"
            exit 1
          fi
          if pip install --no-deps dist/*.tar.gz > /tmp/no-flint.log 2>&1; then
            echo "::error::a source build succeeded without FLINT"
            exit 1
          fi
          tail -n 40 /tmp/no-flint.log
          if ! grep -q 'FLINT_LIB_DIR=' /tmp/no-flint.log; then
            echo "::error::pip failed, but its output does not carry the build.rs install hint"
            exit 1
          fi

      # setup-flint builds FLINT 3.6 (apt's 3.0.1 is below the floor) and exports
      # FLINT_LIB_DIR / FLINT_INCLUDE_DIR / LD_LIBRARY_PATH, the same variables
      # build.rs's message tells a source builder to set.
      - name: Set up FLINT
        uses: ./.github/actions/setup-flint

      # Plain `pip install`: no --features. A source build gets the default Cargo
      # features (egraph, groebner) and rug's bundled GMP/MPFR, not the wheels'
      # cranelift + parallel + system-gmp.
      - name: Build and install from the sdist
        run: pip install dist/*.tar.gz

      - name: Smoke test
        run: |
          python - <<'PY'
          import alkahest as ak
          p = ak.ExprPool()
          assert str(p.integer(10**30)) == str(10**30)
          x = p.symbol('x')
          print(ak.simplify(x + 0).value)
          f = ak.capabilities()["features"]
          assert f["egraph"] and f["groebner"], f
          assert hasattr(ak, 'solve')
          print('sdist build ok:', f)
          PY

      - name: README quickstart + fresh-interpreter parse smoke
        run: python tests/smoke_readme.py

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # LLVM JIT: separate wheels with PEP 440 local version X.Y.Z+jit (PyTorch-style).
  # Not uploaded to main PyPI — avoids pip preferring +jit over the default release.
  #
  # Built natively on ubuntu-24.04 (not manylinux Docker) because llvm-21-dev is
  # available via apt there, whereas the AlmaLinux 8 manylinux_2_28 image has no
  # pre-packaged LLVM 21 and building from source takes 30+ min on a 2-core runner.
  # 24.04 (not 22.04) because jammy's universe stops at llvm-15-dev; noble carries
  # llvm-21-dev. This raises these wheels' glibc floor from 2.35 to 2.39 — acceptable
  # only because they are linux_x86_64-tagged, GitHub-Release-only, never on PyPI.
  # JIT wheels are only attached to GitHub Releases (never PyPI), so the linux_x86_64
  # tag (vs manylinux) is acceptable for this advanced use-case wheel.
  build-linux-jit:
    name: wheels (JIT) / ubuntu-24.04 / py${{ matrix.python }}
    runs-on: ubuntu-24.04
    if: inputs.optional_variants
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # No LLVM_SYS_211_PREFIX here on purpose: `setup-llvm` writes the real
      # prefix (/usr/lib/llvm-21) to $GITHUB_ENV, and a workflow-file `env:`
      # would override it. The old `/usr` was only ever correct because
      # llvm-15-dev came from jammy's universe, which populates /usr/bin via
      # alternatives; the apt.llvm.org debs put llvm-config solely at
      # /usr/lib/llvm-21/bin and ship nothing directly in /usr/bin.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up FLINT
        uses: ./.github/actions/setup-flint

      - name: Set up LLVM 21 (for the jit feature)
        uses: ./.github/actions/setup-llvm

      - name: Use JIT local version in pyproject.toml
        run: |
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("pyproject.toml")
          text = p.read_text()
          m = re.search(r'^version = "([^"]+)"', text, re.M)
          if not m:
              raise SystemExit("no project.version in pyproject.toml")
          base = m.group(1)
          text = re.sub(
              r'^version = "[^"]+"',
              f'version = "{base}+jit"',
              text,
              count=1,
              flags=re.M,
          )
          p.write_text(text)
          print(f"wheel metadata version -> {base}+jit")
          PY

      - name: Install maturin
        run: pip install "maturin==$MATURIN_VERSION"

      # `parallel` is included so this wheel is never a *downgrade* from the
      # default PyPI wheel, which now ships it. Before, installing +jit to gain
      # the LLVM backend silently cost you threads — and `*_par` would have gone
      # on working, just sequentially, with no warning. The only remaining delta
      # against the default wheel is llvm_jit instead of cranelift_jit.
      - name: Build JIT wheel
        run: maturin build --release --strip --features "jit egraph parallel system-gmp" --out dist

      # Maturin/auditwheel vendors deps under site-packages/alkahest.libs/. Transitive
      # loads (e.g. libLLVM → libffi with hashed soname) need that dir on LD_LIBRARY_PATH
      # on some glibc setups until every .so in the wheel has a consistent $ORIGIN RPATH.
      - name: Bundled FLINT/MPFR use no AVX/AVX2/AVX-512
        run: python scripts/check_wheel_isa.py dist/*.whl

      - name: Smoke test (JIT available)
        run: |
          pip install --no-index --find-links dist alkahest
          SITE_LIBS="$(python -c "import os, site; roots=site.getsitepackages(); hits=[os.path.join(r, 'alkahest.libs') for r in roots if os.path.isdir(os.path.join(r, 'alkahest.libs'))]; print(os.pathsep.join(hits))")"
          if [ -n "$SITE_LIBS" ]; then
            export LD_LIBRARY_PATH="${SITE_LIBS}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          python -c "import alkahest as ak; caps = ak.capabilities(); f = caps['features']; assert f['llvm_jit'] and not f['cranelift_jit'], 'expected LLVM-only JIT in +jit wheel'; assert f['parallel'], '+jit must not drop parallel relative to the default wheel'; assert ak.alkahest.GMP_SHARED_WITH_FLINT, 'wheel built without system-gmp'"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-ubuntu-24.04-jit-py${{ matrix.python }}
          path: dist/*.whl

  # Full optional stack (JIT + groebner + parallel + egraph): PEP 440 local version X.Y.Z+full.
  # Same non-PyPI / GitHub Release policy as +jit (see build-linux-jit). Linux x86_64 only in CI.
  #
  # Moving `parallel` into the default wheel briefly made this variant's feature
  # set identical to +jit's — two names for one build. Resolved by giving +full
  # `cranelift` as well, so it is the only wheel carrying *both* JIT backends and
  # a strict superset of every other wheel, which is what its name promises.
  build-linux-full:
    # ubuntu-24.04 for the same reason as build-linux-jit: this variant carries the
    # LLVM JIT backend, and llvm-21-dev is not in jammy's universe.
    name: wheels (+full) / ubuntu-24.04 / py${{ matrix.python }}
    runs-on: ubuntu-24.04
    if: inputs.optional_variants
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # No LLVM_SYS_211_PREFIX here on purpose: `setup-llvm` writes the real
      # prefix (/usr/lib/llvm-21) to $GITHUB_ENV, and a workflow-file `env:`
      # would override it. The old `/usr` was only ever correct because
      # llvm-15-dev came from jammy's universe, which populates /usr/bin via
      # alternatives; the apt.llvm.org debs put llvm-config solely at
      # /usr/lib/llvm-21/bin and ship nothing directly in /usr/bin.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up FLINT
        uses: ./.github/actions/setup-flint

      - name: Set up LLVM 21 (for the jit feature)
        uses: ./.github/actions/setup-llvm

      - name: Use +full local version in pyproject.toml
        run: |
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("pyproject.toml")
          text = p.read_text()
          m = re.search(r'^version = "([^"]+)"', text, re.M)
          if not m:
              raise SystemExit("no project.version in pyproject.toml")
          base = m.group(1)
          text = re.sub(
              r'^version = "[^"]+"',
              f'version = "{base}+full"',
              text,
              count=1,
              flags=re.M,
          )
          p.write_text(text)
          print(f"wheel metadata version -> {base}+full")
          PY

      - name: Install maturin
        run: pip install "maturin==$MATURIN_VERSION"

      # `+full` earns its name by being a strict superset of every other wheel:
      # the only build carrying *both* JIT backends. Until `parallel` moved into
      # the default wheel, `parallel` was this variant's entire distinction from
      # `+jit`; afterwards the two resolved to an identical feature set
      # (`groebner` and `egraph` are defaults in alkahest-py, so naming them
      # here adds nothing), and the release would have shipped two byte-identical
      # wheels under different names. `cranelift` is what makes it distinct again.
      - name: Build +full wheel
        run: >-
          maturin build --release --strip
          --features "jit cranelift groebner parallel egraph system-gmp"
          --out dist

      - name: Bundled FLINT/MPFR use no AVX/AVX2/AVX-512
        run: python scripts/check_wheel_isa.py dist/*.whl

      - name: Smoke test (+full)
        run: |
          pip install --no-index --find-links dist alkahest
          SITE_LIBS="$(python -c "import os, site; roots=site.getsitepackages(); hits=[os.path.join(r, 'alkahest.libs') for r in roots if os.path.isdir(os.path.join(r, 'alkahest.libs'))]; print(os.pathsep.join(hits))")"
          if [ -n "$SITE_LIBS" ]; then
            export LD_LIBRARY_PATH="${SITE_LIBS}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          python -c "import alkahest as ak; caps = ak.capabilities(); f = caps['features']; assert f['llvm_jit'] and f['cranelift_jit'], 'expected BOTH JIT backends in +full wheel'; assert f['parallel'] and f['egraph']; assert hasattr(ak, 'solve'), 'expected groebner APIs in +full wheel'; assert ak.alkahest.GMP_SHARED_WITH_FLINT, 'wheel built without system-gmp'"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-ubuntu-24.04-full-py${{ matrix.python }}
          path: dist/*.whl

  build-wheels:
    name: wheel ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.optional_variants }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = arm64 (Apple Silicon); macos-14 images are retired on
        # 2026-11-02 (actions/runner-images#13518). Intel (x86_64) wheels are no longer
        # produced: macos-13 Intel runners were deprecated by GitHub, and the
        # macos-15 arm64 runner does not ship x86_64 Homebrew, making
        # cross-compilation of libflint impractical. Intel Mac users can install
        # from the sdist or run the arm64 wheel under Rosetta on ARM hardware.
        # A pr_smoke call builds Windows/py3.12 only: its link step is where a
        # missing symbol fails loudest (Linux defers it to import time).
        os: ${{ fromJSON(inputs.pr_smoke && '["windows-2022"]' || '["macos-15", "windows-2022"]') }}
        python: ${{ fromJSON(inputs.pr_smoke && '["3.12"]' || '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install flint
          # `system-gmp` (passed to maturin below): rug links Homebrew's gmp/mpfr, the ones
          # flint uses. gmp-mpfr-sys probes with a bare `cc … -lgmp` and Apple
          # clang does not search /opt/homebrew — see ci-cross.yml.
          gmp=$(brew --prefix gmp); mpfr=$(brew --prefix mpfr)
          echo "CPATH=$gmp/include:$mpfr/include${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$gmp/lib:$mpfr/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          # UCRT64, not MINGW64: MSYS2 dropped `mingw-w64-x86_64-flint`
          # (2026-10-19) — see ci-cross.yml. The wheel's DLLs then use the
          # UCRT (ucrtbase.dll), the same CRT CPython links against.
          # path-type: inherit lets the MSYS2 shell see Windows PATH so cargo,
          # rustup, and Python (installed by setup-python) are reachable.
          path-type: inherit
          # pkg-config is required: with the `system-gmp` feature (passed below),
          # gmp-mpfr-sys finds MSYS2's libgmp via `pkg-config gmp` and links
          # it (the same one FLINT uses) instead of compiling its own.
          # base-devel (m4, autoconf, make, …) is only needed if a build falls
          # back to the bundled GMP/MPFR (a build without system-gmp); kept so that
          # fallback still works here.
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-flint
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Add GNU Rust target (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install maturin
        run: pip install "maturin==$MATURIN_VERSION"

      # Feature set must stay identical to build-linux's: this is the same
      # default PyPI wheel, and `parallel` in particular has to be on every
      # platform or `capabilities()["features"]["parallel"]` means something
      # different depending on where the user installed from. rayon + dashmap
      # are pure Rust with no system dependency, and ci-cross.yml already builds
      # `parallel` on both macos-15 and windows-2022 (MinGW), so this adds no
      # new toolchain requirement to either runner.
      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        run: maturin build --release --strip --features "egraph groebner cranelift parallel system-gmp" --out dist

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        # msys2 {0} runs inside the UCRT64 shell where gcc, sh, pkg-config and
        # /ucrt64/bin's DLLs (gmp-mpfr-sys runs its system-GMP probe binary)
        # are all on PATH. The
        # previous Git-bash approach only set PATH in the outer shell, so the
        # build script's `sh -c "configure ..."` couldn't find the compiler.
        shell: msys2 {0}
        run: |
          maturin build --release --strip --features "egraph groebner cranelift parallel system-gmp" --target x86_64-pc-windows-gnu --out dist

      - name: Repair wheel with delvewheel (Windows)
        if: runner.os == 'Windows'
        # The mingw-built wheel dynamically links libflint, libgmp, libmpfr,
        # libgcc_s_seh, libwinpthread from MSYS2. delvewheel is the Windows
        # equivalent of auditwheel — it copies those DLLs into the wheel's
        # *.libs/ directory and rewrites the .pyd's import table so end users
        # don't need MSYS2 installed.
        shell: msys2 {0}
        run: |
          python -m pip install delvewheel
          MSYS2_BIN=$(cygpath -w /ucrt64/bin)
          mkdir -p dist-repaired
          for whl in dist/*.whl; do
            python -m delvewheel repair --add-path "$MSYS2_BIN" -w dist-repaired "$whl"
          done
          rm dist/*.whl
          mv dist-repaired/*.whl dist/

      - name: Smoke test
        run: |
          pip install --no-index --find-links dist alkahest
          python -c "import alkahest; p = alkahest.ExprPool(); assert str(p.integer(10**30)) == str(10**30); x = p.symbol('x'); print(alkahest.simplify(x + 0)); caps = alkahest.capabilities(); f = caps['features']; assert f['egraph'] and f['groebner'] and f['cranelift_jit'] and f['parallel']; assert not f['llvm_jit']; assert caps['jit'] and alkahest.jit_is_available(); assert alkahest.alkahest.GMP_SHARED_WITH_FLINT, 'wheel built without system-gmp'"

      # See build-linux's identical step: catches the class of bug (B1, B6)
      # that only reproduces against a real wheel install in a fresh
      # interpreter, not an editable/dev environment or a warmed-up process.
      # PYTHONIOENCODING: Windows runners default to cp1252; Lean certs print ∫.
      - name: README quickstart + fresh-interpreter parse smoke
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tests/smoke_readme.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
