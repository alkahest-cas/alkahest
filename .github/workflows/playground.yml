name: Deploy playground

on:
  push:
    branches: [main]
    paths:
      - 'demo-playground/**'
      - '.github/workflows/playground.yml'
  pull_request:
    paths:
      - 'demo-playground/**'
      - '.github/workflows/playground.yml'
  workflow_dispatch:

concurrency:
  group: playground-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: Math endpoint tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install server dependencies and Alkahest
        working-directory: demo-playground/server
        run: pip install -r requirements.txt alkahest httpx pytest ruff

      - name: Lint
        working-directory: demo-playground/server
        run: |
          ruff format --check mathlang.py math_exec.py math_service.py math_worker.py main.py tests
          ruff check mathlang.py math_exec.py math_service.py math_worker.py main.py tests

      - name: Tests
        working-directory: demo-playground/server
        run: pytest

  deploy:
    name: Deploy to alkahest-cas.github.io/playground
    needs: test-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: demo-playground/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: demo-playground/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: demo-playground
        run: pnpm install --frozen-lockfile

      - name: Build static export
        working-directory: demo-playground/web
        run: pnpm run build:static
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Deploy to GitHub Pages site
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: alkahest-cas/alkahest-cas.github.io
          publish_branch: main
          publish_dir: demo-playground/web/out
          destination_dir: playground
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy playground: ${{ github.sha }}'
