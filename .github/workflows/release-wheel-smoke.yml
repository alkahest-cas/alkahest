name: Release wheel smoke

# Builds the release-style default wheels on a PR, before it merges, and
# smoke-tests them: one manylinux py3.12 wheel and one Windows py3.12 wheel.
# They are built by release-wheels.yml, the same reusable workflow the
# release uses (same features incl. system-gmp, same maturin invocation, same
# manylinux container and before-script, same delvewheel repair), so this
# check cannot drift from what a release ships.
#
# Why: release-build.yml's `pull_request` trigger fires only once a PR has
# merged. #395 called `pyo3::ffi::PyIndex_Check`, which pyo3-ffi 0.21 binds to
# the PyPy symbol `PyPyIndex_Check`. The dev builds PR CI makes were fine, but
# every release wheel failed to import (Linux) or to link (Windows) for 13
# merges, until #419.
#
# Read-only throughout: release-wheels.yml contains no publish or upload jobs
# and asks for nothing beyond `contents: read`. That makes this safe for PRs
# from forks, whose token is read-only anyway.

#
# Which changes build wheels is the `wheels` filter in changes.yml (it was a
# trigger-level `paths:` list; moved so the check reports "skipped" rather
# than never appearing, which is what lets it be a required check).

on:
  pull_request:
    branches:
      - main
  merge_group:
  # Manual run of the FULL release matrix (every OS and Python version) on any
  # branch, without publishing — use it before tagging.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-wheel-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter; see the table at the top of ci.yml. Skipped (not pending) for
  # changes this workflow cannot be affected by.
  changes:
    name: changes
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  release-wheels:
    name: release wheels
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.wheels == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-wheels.yml
    with:
      # A merge group gets the same reduced matrix as a pull request; the full
      # matrix is for workflow_dispatch before tagging.
      pr_smoke: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

  # One stable check name to require. The reusable workflow's own checks are
  # named `release wheels / <inner job>`, and when it is skipped by the filter
  # none of them appear at all — a required check on one would wait forever.
  smoke-result:
    name: Release wheel smoke
    needs: [changes, release-wheels]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wheels built and smoke-tested, or not affected
        env:
          RESULT: ${{ needs.release-wheels.result }}
        run: |
          echo "release wheels: $RESULT"
          if [ "$RESULT" != success ] && [ "$RESULT" != skipped ]; then
            echo "::error title=Release wheel smoke failed::release wheels: $RESULT"
            exit 1
          fi
