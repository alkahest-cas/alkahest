name: Release wheel smoke

# Builds the release-style default wheel on a PR, before it merges, and
# smoke-tests it: one manylinux py3.12 wheel and one Windows py3.12 wheel,
# built by release-build.yml itself (same features incl. system-gmp, same
# maturin invocation, same manylinux container and before-script, same
# delvewheel repair), so this check cannot drift from what a release ships.
#
# Why: release-build.yml's `pull_request` trigger fires only once a PR has
# merged. #395 called `pyo3::ffi::PyIndex_Check`, which pyo3-ffi 0.21 binds to
# the PyPy symbol `PyPyIndex_Check`; the dev builds PR CI makes were fine, but
# every release wheel failed to import (Linux) or to link (Windows) for 13
# merges until #419. Nothing in this workflow can publish: in pr_smoke mode
# release-build.yml runs only its build + smoke jobs.

on:
  pull_request:
    branches:
      - main
    paths:
      - "alkahest-py/**"
      - "alkahest-core/**"
      - "Cargo.*"
      - "pyproject.toml"
      - ".github/workflows/release-build.yml"
      - ".github/workflows/release-wheel-smoke.yml"
      - ".github/actions/**"
      - "tests/smoke_readme.py"

permissions:
  contents: read

concurrency:
  group: release-wheel-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-wheels:
    name: release wheels
    uses: ./.github/workflows/release-build.yml
    with:
      pr_smoke: true
