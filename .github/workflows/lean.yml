# V5-8: Lean 4 certificate verification CI
# Installs Lean 4 + Mathlib and verifies generated .lean proofs.
name: Lean 4 Proofs

on:
  push:
    branches: [main]
    paths:
      - 'alkahest-core/src/lean/**'
      - 'alkahest-core/src/deriv/**'
      - 'alkahest-core/src/diff/**'
      - 'alkahest-core/src/simplify/**'
      - 'alkahest-core/src/kernel/**'
      - 'alkahest-core/src/calculus/**'
      - 'alkahest-core/src/sum/**'
      - 'alkahest-py/src/lib.rs'
      - 'tests/lean_corpus.py'
      - 'tests/lean_corpus_sample.py'
      - 'tests/lean_tendsto_corpus.py'
      - 'tests/lean_sos_corpus.py'
      - 'tests/lean_gosper_corpus.py'
      - 'tests/lean_integrate_corpus.py'
      - 'tests/lean_ode_corpus.py'
      - 'tests/lean_fex_corpus.py'
      - 'python/alkahest/_fex_lean.py'
      - 'alkahest-core/src/integrate/**'
      - 'alkahest-core/src/poly/resultant.rs'
      - 'alkahest-core/src/holonomic/**'
      - 'alkahest-core/src/real/sos/**'
      - 'tests/_tg_helpers.py'
      - 'tests/textbook_gate/**'
      - 'tests/test_smoke.py'
      - 'lean/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'alkahest-py/Cargo.toml'
      - '.github/workflows/lean.yml'
  # Pull requests and merge groups are filtered by the `lean` output of
  # changes.yml (the same path list this trigger used to carry), so the check
  # reports "skipped" rather than never appearing.
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  # Path filter; see the table at the top of ci.yml. Skipped (not pending) for
  # changes this workflow cannot be affected by.
  changes:
    name: changes
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  lean-verify:
    name: Verify Lean 4 proofs
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lean == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install Lean 4 via elan
        run: |
          # To a file, not `curl | sh`: without pipefail a failed download would
          # hand sh an empty script and the step would pass with no Lean installed.
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 15 --connect-timeout 30 -o /tmp/elan-init.sh \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          # The toolchain is the one pinned in lean/lean-toolchain (kept in step
          # with the Mathlib tag in lean/lakefile.lean and lean/lake-manifest.json).
          sh /tmp/elan-init.sh --default-toolchain "$(cat lean/lean-toolchain)" -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain and Mathlib oleans
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean', 'lean/lake-manifest.json') }}-v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # (Builds with the runner image's preinstalled Rust, as before.)
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: lean
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up FLINT
        uses: ./.github/actions/setup-flint

      - name: Install maturin and build alkahest
        run: |
          python -m venv .venv
          # maturin ≥1.13 uses `pip install --group` (PEP 735) which requires pip ≥25.
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin pytest hypothesis
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/maturin develop -m alkahest-py/Cargo.toml --features groebner

      - name: Generate Lean proofs (fixed strict corpus)
        run: |
          python tests/lean_corpus.py --output /tmp/lean_proofs/

      - name: Generate Lean proofs (Filter.Tendsto corpus)
        run: |
          python tests/lean_tendsto_corpus.py --output /tmp/lean_tendsto/

      - name: Generate Lean proofs (Gosper Finset.sum corpus)
        run: |
          python tests/lean_gosper_corpus.py --output /tmp/lean_gosper/

      - name: Generate Lean proofs (indefinite-integral HasDerivAt corpus)
        run: |
          # Default mode: reflective `Alkahest.Kernel` certificates, tactic
          # fallback. The second run keeps the tactic emitter itself checked.
          python tests/lean_integrate_corpus.py --output /tmp/lean_integrate/
          python tests/lean_integrate_corpus.py --mode tactic --output /tmp/lean_integrate_tactic/

      - name: Generate Lean proofs (ODE solution certificates, reflective kernel)
        run: |
          python tests/lean_ode_corpus.py --output /tmp/lean_ode/

      - name: Generate Lean proofs (FEX PDE-residual certificates, reflective kernel)
        run: |
          python tests/lean_fex_corpus.py --output /tmp/lean_fex/

      - name: Generate Lean proofs (full deduplicated textbook-gate pool)
        run: |
          # Every distinct certificate the library emits from the textbook gate
          # — not a random sample. A random draw made CI green by luck; the full
          # deduplicated pool surfaces any non-compiling certificate every run.
          python tests/lean_corpus_sample.py --output /tmp/lean_pool/

      - name: Generate Lean proofs (SOS positivity certificates)
        run: |
          python tests/lean_sos_corpus.py --output /tmp/lean_sos/

      - name: Set up Mathlib (prebuilt oleans from the Mathlib cache)
        run: |
          cd lean
          # lake-manifest.json pins the exact Mathlib revision; `cache get`
          # downloads its prebuilt oleans so Mathlib is never built from source.
          lake exe cache get

      - name: Build the Alkahest.Kernel library (reflective certificate checker)
        run: |
          cd lean
          # The kernel's own sources must be admission-free: every certificate
          # that imports it inherits whatever it assumes.
          if grep -rEn '\b(sorry|admit|axiom)\b' Alkahest Alkahest.lean; then
            echo "Alkahest.Kernel contains an admission"
            exit 1
          fi
          lake build Alkahest
          lake env lean -DwarningAsError=true -DautoImplicit=false test/KernelSmoke.lean

      - name: Verify proofs with Lean without admissions
        run: |
          cd lean
          # Every file is checked (four at a time) and every failure is listed,
          # so one run reports the whole picture rather than the first error.
          check() {
            f="$1"
            fname=$(basename "$(dirname "$f")")/$(basename "$f")
            if grep -Eq '\b(sorry|admit|axiom|native_decide)\b' "$f"; then
              echo "FAILED: $fname contains an admission"
              return 1
            fi
            # autoImplicit=false: every free variable must be bound by an
            # explicit binder. Under Lean's default a printed `(x : ℝ)` was
            # silently auto-bound, so an unbound variable passed unnoticed.
            start=$(date +%s)
            if out=$(lake env lean -DwarningAsError=true -DautoImplicit=false "$f" 2>&1); then
              echo "ok $fname ($(( $(date +%s) - start ))s)"
            else
              echo "FAILED: $fname"
              echo "$out" | head -n 40
              return 1
            fi
          }
          export -f check
          total=0
          failed=0
          for dir in /tmp/lean_proofs /tmp/lean_tendsto /tmp/lean_gosper /tmp/lean_integrate /tmp/lean_integrate_tactic /tmp/lean_ode /tmp/lean_fex /tmp/lean_pool /tmp/lean_sos; do
            n=$(ls "$dir"/*.lean 2>/dev/null | wc -l)
            echo "== Verifying $n certificates in $dir =="
            log=$(mktemp)
            ls "$dir"/*.lean | xargs -P 4 -I{} bash -c 'check "$@"' _ {} > "$log" 2>&1 || true
            cat "$log"
            bad=$(grep -c '^FAILED:' "$log" || true)
            echo "== $dir: $((n - bad))/$n verified =="
            total=$((total + n))
            failed=$((failed + bad))
          done
          echo "== $(lean --version | head -n 1): $((total - failed))/$total certificates verified =="
          if [ "$failed" -ne 0 ]; then
            echo "$failed certificate(s) failed to verify"
            exit 1
          fi
          echo "All generated Lean proofs (fixed corpus + Tendsto corpus + Gosper corpus + integration corpus + full textbook-gate pool + SOS) verified without admissions."

      - name: Upload generated Lean proofs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-lean-proofs
          path: |
            /tmp/lean_proofs
            /tmp/lean_tendsto
            /tmp/lean_gosper
            /tmp/lean_integrate
            /tmp/lean_integrate_tactic
            /tmp/lean_ode
            /tmp/lean_pool
            /tmp/lean_sos
          if-no-files-found: ignore
