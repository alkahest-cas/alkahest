# V5-8: Lean 4 certificate verification CI
# Installs Lean 4 + Mathlib and verifies generated .lean proofs.
name: Lean 4 Proofs

on:
  push:
    branches: [main]
    paths:
      - 'alkahest-core/src/lean/**'
      - 'alkahest-core/src/deriv/**'
      - 'alkahest-core/src/diff/**'
      - 'alkahest-core/src/simplify/**'
      - 'alkahest-core/src/kernel/**'
      - 'alkahest-core/src/calculus/**'
      - 'alkahest-core/src/sum/**'
      - 'alkahest-py/src/lib.rs'
      - 'tests/lean_corpus.py'
      - 'tests/lean_corpus_sample.py'
      - 'tests/lean_tendsto_corpus.py'
      - 'tests/lean_sos_corpus.py'
      - 'tests/lean_gosper_corpus.py'
      - 'alkahest-core/src/poly/resultant.rs'
      - 'alkahest-core/src/holonomic/**'
      - 'alkahest-core/src/real/sos/**'
      - 'tests/_tg_helpers.py'
      - 'tests/textbook_gate/**'
      - 'tests/test_smoke.py'
      - 'lean/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'alkahest-py/Cargo.toml'
      - '.github/workflows/lean.yml'
  # Pull requests and merge groups are filtered by the `lean` output of
  # changes.yml (the same path list this trigger used to carry), so the check
  # reports "skipped" rather than never appearing.
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  # Path filter; see the table at the top of ci.yml. Skipped (not pending) for
  # changes this workflow cannot be affected by.
  changes:
    name: changes
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  lean-verify:
    name: Verify Lean 4 proofs
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lean == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install Lean 4 via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- --default-toolchain leanprover/lean4:v4.9.0 -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain and Mathlib oleans
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean', 'lean/lake-manifest.json') }}-v2
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # (Builds with the runner image's preinstalled Rust, as before.)
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: lean
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up FLINT
        uses: ./.github/actions/setup-flint

      - name: Install maturin and build alkahest
        run: |
          python -m venv .venv
          # maturin ≥1.13 uses `pip install --group` (PEP 735) which requires pip ≥25.
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin pytest hypothesis
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/maturin develop -m alkahest-py/Cargo.toml --features groebner

      - name: Generate Lean proofs (fixed strict corpus)
        run: |
          python tests/lean_corpus.py --output /tmp/lean_proofs/

      - name: Generate Lean proofs (Filter.Tendsto corpus)
        run: |
          python tests/lean_tendsto_corpus.py --output /tmp/lean_tendsto/

      - name: Generate Lean proofs (Gosper Finset.sum corpus)
        run: |
          python tests/lean_gosper_corpus.py --output /tmp/lean_gosper/

      - name: Generate Lean proofs (full deduplicated textbook-gate pool)
        run: |
          # Every distinct certificate the library emits from the textbook gate
          # — not a random sample. A random draw made CI green by luck; the full
          # deduplicated pool surfaces any non-compiling certificate every run.
          python tests/lean_corpus_sample.py --output /tmp/lean_pool/

      - name: Generate Lean proofs (SOS positivity certificates)
        run: |
          python tests/lean_sos_corpus.py --output /tmp/lean_sos/

      - name: Set up Mathlib (lake update + cache get)
        run: |
          cd lean
          lake update
          lake exe cache get

      - name: Verify proofs with Lean without admissions
        run: |
          cd lean
          for dir in /tmp/lean_proofs /tmp/lean_tendsto /tmp/lean_gosper /tmp/lean_pool /tmp/lean_sos; do
            echo "== Verifying certificates in $dir =="
            for f in "$dir"/*.lean; do
              fname=$(basename "$f")
              echo "Verifying $fname..."
              if grep -Eq '\b(sorry|admit|axiom)\b' "$f"; then
                echo "FAILED: $fname contains an admission"
                exit 1
              fi
              # autoImplicit=false: every free variable must be bound by an
              # explicit binder. Under Lean's default a printed `(x : ℝ)` was
              # silently auto-bound, so an unbound variable passed unnoticed.
              lake env lean -DwarningAsError=true -DautoImplicit=false "$f" || { echo "FAILED: $fname"; exit 1; }
            done
          done
          echo "All generated Lean proofs (fixed corpus + Tendsto corpus + Gosper corpus + full textbook-gate pool + SOS) verified without admissions."

      - name: Upload generated Lean proofs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-lean-proofs
          path: |
            /tmp/lean_proofs
            /tmp/lean_tendsto
            /tmp/lean_gosper
            /tmp/lean_pool
            /tmp/lean_sos
          if-no-files-found: ignore
