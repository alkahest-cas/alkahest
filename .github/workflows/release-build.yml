name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

# Read-only unless a job says otherwise. Only the three upload jobs below do,
# and they run only after a merge, on a tag, or on dispatch from main. The
# wheels are built by release-wheels.yml, which also serves the pre-merge
# check in release-wheel-smoke.yml with the same read-only token.
permissions:
  contents: read

jobs:
  # Default wheels: manylinux (py3.9-3.13), macOS arm64 and Windows.
  wheels:
    name: wheels
    if: github.event_name != 'pull_request' || github.event.pull_request.merged
    permissions:
      contents: read
    uses: ./.github/workflows/release-wheels.yml

  # +jit / +full Linux wheels (GitHub Release only, never PyPI). A separate call
  # so the PyPI jobs keep depending on the default wheels alone, as before.
  wheels-optional:
    name: wheels (optional)
    if: github.event_name != 'pull_request' || github.event.pull_request.merged
    permissions:
      contents: read
    uses: ./.github/workflows/release-wheels.yml
    with:
      optional_variants: true

  # The upload jobs stay in this file: PyPI's trusted publisher is configured
  # for workflow `release-build.yml` + environment `release`, and a job in a
  # called (reusable) workflow would present a different workflow identity.
  publish-testpypi:
    name: publish to TestPyPI
    needs: [wheels]
    runs-on: ubuntu-latest
    # A manual dispatch publishes only from main. Dispatching from any other
    # branch builds and smoke-tests every wheel without uploading anything,
    # which is how a PR that changes this workflow is checked before merge:
    # the `pull_request` trigger above fires only once a PR has merged.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.event.pull_request.merged)
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Exclude local-version (+jit / +full) wheels from TestPyPI upload
        run: |
          mkdir -p dist-pypi
          shopt -s nullglob
          for whl in dist/*.whl; do
            b=$(basename "$whl")
            case "$b" in
              *+jit*|*+full*) ;;
              *) cp "$whl" dist-pypi/ ;;
            esac
          done
          rm -rf dist
          mv dist-pypi dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: publish to PyPI
    needs: [wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Exclude local-version (+jit / +full) wheels from PyPI upload
        run: |
          mkdir -p dist-pypi
          shopt -s nullglob
          for whl in dist/*.whl; do
            b=$(basename "$whl")
            case "$b" in
              *+jit*|*+full*) ;;
              *) cp "$whl" dist-pypi/ ;;
            esac
          done
          rm -rf dist
          mv dist-pypi dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  attach-optional-linux-wheels:
    name: attach +jit / +full wheels to GitHub Release
    needs: [wheels-optional]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-ubuntu-24.04-*-py*
          path: dist-extras
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist-extras/*.whl
