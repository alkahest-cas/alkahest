name: Set up FLINT
description: >
  Build and cache a pinned FLINT on an Ubuntu runner, then export
  FLINT_LIB_DIR / FLINT_INCLUDE_DIR / LD_LIBRARY_PATH. Factored out because
  Ubuntu 24.04's libflint-dev is 3.0.1, which is too old for the acb_theta
  module: FLINT absorbed Arb in 3.0 but rewrote the theta API in 3.2
  (acb_theta_naive_* -> acb_theta_sum / acb_theta_ql_* / acb_theta_jet).
  `alkahest-core/build.rs` probes libflint's symbol table and silently stubs
  the `theta` module when those entry points are absent — so on stock apt
  FLINT the theta tests would pass without executing anything. This action is
  what keeps that from happening.

  It also guarantees GMP >= 6.3 and MPFR >= 4.2. The crate's opt-in
  `system-gmp` feature (which the PyPI wheels and the PyPI-parity CI builds
  enable) links rug against the system libgmp/libmpfr (the same
  ones FLINT uses), and gmp-mpfr-sys refuses anything older. Ubuntu 24.04's
  apt packages qualify (6.3.0 / 4.2.1); 22.04's (6.2.1 / 4.1.0) do not, so on
  such a runner pinned GMP/MPFR are built into the same prefix *first* and
  FLINT is configured against them — one GMP for FLINT and rug alike.

inputs:
  version:
    description: FLINT release to build (>= 3.3 to link at all, >= 3.4 for genus-g theta).
    required: false
    default: "3.6.0"
  sha256:
    description: >
      SHA-256 of the release tarball. Required for the default version; pass
      an empty string only together with a non-default `version`, which is
      then built unverified.
    required: false
    default: "b95e2c7792f5eea4a1c8d2d42c4098434756832e57a094b295eb5dfdc9b4c36b"

runs:
  using: composite
  steps:
    - name: Install FLINT's build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev m4

    # The prefix below is cached, so the key has to separate runner images:
    # a prefix built on 22.04 carries its own GMP, one built on 24.04 does not.
    - name: Decide whether apt's GMP/MPFR are new enough
      id: gmp
      shell: bash
      run: |
        set -euo pipefail
        ver() { dpkg-query -W -f='${Version}' "$1" | sed -E 's/^[0-9]+://; s/[+~-].*//'; }
        gmp=$(ver libgmp-dev); mpfr=$(ver libmpfr-dev)
        echo "apt GMP $gmp, MPFR $mpfr (need >= 6.3 / >= 4.2)"
        if dpkg --compare-versions "$gmp" ge 6.3 && dpkg --compare-versions "$mpfr" ge 4.2; then
          echo "build=false" >> "$GITHUB_OUTPUT"
        else
          echo "build=true" >> "$GITHUB_OUTPUT"
        fi
        echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

    - name: Restore cached FLINT
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.local/flint
        key: flint-${{ inputs.version }}-gmp${{ steps.gmp.outputs.build == 'true' && '-6.3.0-mpfr-4.2.2' || '-apt' }}-${{ steps.gmp.outputs.os }}-${{ runner.arch }}

    - name: Build GMP 6.3.0 + MPFR 4.2.2 (apt's are too old)
      if: steps.cache.outputs.cache-hit != 'true' && steps.gmp.outputs.build == 'true'
      shell: bash
      run: |
        set -euo pipefail
        prefix="$HOME/.local/flint"
        cd /tmp
        curl -fsSLO https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
        curl -fsSLO https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz
        sha256sum -c - <<'SUMS'
        a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898  gmp-6.3.0.tar.xz
        b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01  mpfr-4.2.2.tar.xz
        SUMS
        tar xf gmp-6.3.0.tar.xz && tar xf mpfr-4.2.2.tar.xz
        ( cd gmp-6.3.0 && ./configure --prefix="$prefix" --enable-shared --disable-static && make -j"$(nproc)" && make install )
        ( cd mpfr-4.2.2 && ./configure --prefix="$prefix" --with-gmp="$prefix" --enable-shared --disable-static && make -j"$(nproc)" && make install )

    - name: Build FLINT ${{ inputs.version }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Pinned by tag, so a yanked or re-rolled release fails loudly at the
        # download rather than quietly changing what CI links against.
        tarball="/tmp/flint-${{ inputs.version }}.tar.gz"
        curl -fsSL -o "$tarball" "https://github.com/flintlib/flint/releases/download/v${{ inputs.version }}/flint-${{ inputs.version }}.tar.gz"
        if [ -n "${{ inputs.sha256 }}" ]; then
          echo "${{ inputs.sha256 }}  $tarball" | sha256sum -c -
        else
          echo "::warning::FLINT ${{ inputs.version }} tarball not checksum-verified (no sha256 input)"
        fi
        tar xzf "$tarball" -C /tmp
        cd "/tmp/flint-${{ inputs.version }}"
        prefix="$HOME/.local/flint"
        with_gmp=()
        if [ "${{ steps.gmp.outputs.build }}" = true ]; then
          with_gmp=(--with-gmp="$prefix" --with-mpfr="$prefix")
        fi
        ./configure --prefix="$prefix" --disable-static "${with_gmp[@]}"
        make -j"$(nproc)"
        make install

    - name: Export FLINT paths
      shell: bash
      run: |
        set -euo pipefail
        prefix="$HOME/.local/flint"
        echo "FLINT_LIB_DIR=$prefix/lib"          >> "$GITHUB_ENV"
        echo "FLINT_INCLUDE_DIR=$prefix/include"  >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        # gmp-mpfr-sys (use-system-libs) probes GMP/MPFR with a bare
        # `cc probe.c -lgmp`, which honours only the compiler's default paths
        # and these two variables. Prepending the prefix makes a source-built
        # GMP win over an older apt one; with apt's GMP it is a no-op.
        echo "CPATH=$prefix/include${CPATH:+:$CPATH}"                    >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=$prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"   >> "$GITHUB_ENV"

    - name: Report what the build will actually see
      shell: bash
      run: |
        set -euo pipefail
        lib="$HOME/.local/flint/lib/libflint.so"
        echo "FLINT version: $(grep -m1 'define FLINT_VERSION ' "$HOME/.local/flint/include/flint/flint.h" || echo unknown)"
        echo "FLINT links: $(ldd "$lib" | grep -E 'libgmp|libmpfr' | tr -s ' \t' ' ' | tr '\n' ';')"
        # These two probes mirror build.rs exactly. Printing them means a
        # stubbed `theta` module is visible in the log instead of being
        # inferred from a suspiciously fast, suspiciously green test run.
        # Symbol table captured once: `nm | grep -q` under pipefail reports a
        # *found* symbol as missing (grep exits early, nm gets SIGPIPE).
        syms=$(nm -D --defined-only "$lib")
        for sym in acb_modular_j acb_mat_entry_ptr acb_theta_ctx_tau_init acb_theta_ql_exact; do
          if grep -q " T $sym$" <<<"$syms"; then
            echo "  present: $sym"
          else
            echo "  MISSING: $sym  <-- theta will be stubbed"
          fi
        done
